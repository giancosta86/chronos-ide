buildscript {
    repositories {
        //TODO! Del this!
        mavenLocal()

        mavenCentral()
    }

    dependencies {
        classpath 'info.gianlucacosta.aurora:aurora:10.0.0-SNAPSHOT'
    }
}


apply plugin: 'scala'
apply plugin: 'application'
apply plugin: 'info.gianlucacosta.aurora'


group 'info.gianlucacosta.chronos'
archivesBaseName = 'chronos-ide'
version '4.0.0-SNAPSHOT'

description = "Integrated development environment for the Chronos programming language"

sourceCompatibility = 1.8

mainClassName = 'info.gianlucacosta.chronos.ide.App'


dependencies {
    compile 'org.scala-lang:scala-library:2.11.8'

    compile 'info.gianlucacosta.helios:helios-fx:7.0.0-SNAPSHOT'
    compile 'info.gianlucacosta.omnieditor:omnieditor:6.0.0-SNAPSHOT'
    compile 'info.gianlucacosta.chronos:chronos:5.0.0-SNAPSHOT'
}


aurora {
    gitHubUser = 'giancosta86'

    author {
        name = 'Gianluca Costa'
        email = 'gianluca@gianlucacosta.info'
        url = 'http://gianlucacosta.info/'
    }
}
